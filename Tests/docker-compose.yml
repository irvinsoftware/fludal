services:
  sql-server:
    build: .
    image: sqlserver2022custom
    container_name: fludal_sqlserver
    environment:
      MSSQL_SA_PASSWORD: "password_OfASufficent_Length11"
    ports:
      - 1444:1433
  
  postgres:
    image:  postgres:latest
    container_name: fludal_postgres
    environment:
      POSTGRES_PASSWORD: "mypassword"
    ports:
      - 5429:5432
